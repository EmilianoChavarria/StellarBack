[package]
name = "hello-world"
version = "0.1.0"
description = "A Soroban contract"
authors = ["jgerardo.toledor@gmail.com"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "20.0.1"

[dev-dependencies]
soroban-sdk = { version = "20.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true